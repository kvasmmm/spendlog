name: Verify SpendLog
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: npm ci && npm run test:helpers && npm run build
        working-directory: frontend
      - name: Build and start the real containers
        env:
          APP_PASSWORD: ci-isolated-test-password-only
          COOKIE_SECURE: 'false'
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Check nginx to API routing
        run: python -c "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/health'))['ok']"
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
        env:
          APP_PASSWORD: ci-isolated-test-password-only
